# Mini-proxy entre Traefik y el socket de Docker.
# Docker Engine 29 exige API >= 1.40 y rechaza (400) la versión vieja que pide el
# SDK embebido de Traefik. Aquí reescribimos CUALQUIER prefijo /vX.YZ/ a /v1.44/
# (versión soportada), así el provider docker de Traefik funciona sin tocar Traefik.
# Además, Traefik ya NO necesita montar el socket directamente (lo hace este proxy).

user root;          # los workers necesitan leer /var/run/docker.sock (root)
events {}

http {
    upstream docker {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;

        location / {
            # /v1.24/containers/json -> /v1.44/containers/json ; lo sin versión pasa igual.
            rewrite ^/v[0-9.]+/(.*)$ /v1.44/$1 break;
            proxy_pass http://docker;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_buffering off;        # necesario para el stream de /events (watch)
            proxy_read_timeout 1h;
        }
    }
}
