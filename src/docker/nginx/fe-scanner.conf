# ⚠️ OBSOLETO / SOLO REFERENCIA — Reemplazado por TRAEFIK (servicio 'traefik' en
# docker-compose.prod.yml). El gateway ahora vive en compose y enruta por labels.
# Este archivo se conserva como referencia del ruteo y por si se quisiera volver a
# un Nginx en el host. NO instalar junto con Traefik (ambos pelearían por el :80).
#
# Nginx (en el HOST del VPS) — reverse proxy para FE Scanner API.
#
# Instalación:
#   sudo cp fe-scanner.conf /etc/nginx/sites-available/fe-scanner
#   sudo ln -s /etc/nginx/sites-available/fe-scanner /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (recomendado): tras dejar funcionando este bloque en HTTP, corre
#   sudo certbot --nginx -d api.tudominio.com
# Certbot reescribe este archivo solo para añadir el listen 443 + certificados.

server {
    listen 80;
    server_name api.tudominio.com;          # ← CAMBIA por tu dominio (o la IP del VPS)

    # La subida de fotos para enrolar rostro pesa más que el default (1 MB).
    client_max_body_size 15m;

    # Cabeceras de proxy comunes (se heredan en todos los 'location' que no
    # definan las suyas). Timeout alto porque el primer request al backend puede
    # cargar el modelo facial.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout    120s;

    # ── Microservicio identity (login, JWT, usuarios, roles) → 8001 ──
    location /usuarios { proxy_pass http://127.0.0.1:8001; }
    location /roles    { proxy_pass http://127.0.0.1:8001; }

    # ── Microservicio tenancy (empresas, áreas, puertas, dispositivos) → 8002 ──
    location /empresas     { proxy_pass http://127.0.0.1:8002; }
    location /areas        { proxy_pass http://127.0.0.1:8002; }
    location /puertas      { proxy_pass http://127.0.0.1:8002; }
    location /dispositivos { proxy_pass http://127.0.0.1:8002; }

    # ── Microservicio workers (trabajadores, embeddings) → 8003 ──
    location /trabajadores { proxy_pass http://127.0.0.1:8003; }
    location /embeddings   { proxy_pass http://127.0.0.1:8003; }

    # ── Microservicio reports (reportes, solo lectura) → 8004 ──
    location /reportes { proxy_pass http://127.0.0.1:8004; }

    # ── Resto de la API → backend access (asistencia/escaneos/incidencias/intentos/scanner) → 8000 ──
    location / {
        proxy_pass http://127.0.0.1:8000;   # backend dockerizado (solo escucha local)
    }
}
