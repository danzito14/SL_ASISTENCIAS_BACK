# ── nginx del HOST — vhost para sl-asistencias.slagricola.cloud ───────────────
# Tu nginx ya sirve varios sitios en :80/:443 con certbot. Este server hace
# reverse-proxy de TODO el dominio al Traefik INTERNO del stack nuevo
# (127.0.0.1:8005). Traefik enruta a los microservicios, recorta /api y valida el
# JWT. nginx solo termina TLS y reenvía.
#
# Si YA tienes un server block para este dominio (apuntando al back v1/monolito),
# NO agregues otro: solo cambia su `proxy_pass` a http://127.0.0.1:8005 y recarga
# nginx (`sudo nginx -t && sudo systemctl reload nginx`). Esto es la referencia.
#
# El certificado ya lo tienes (v1 en HTTPS). Si no, emítelo:
#   sudo certbot --nginx -d sl-asistencias.slagricola.cloud

server {
    listen 80;
    listen [::]:80;
    server_name sl-asistencias.slagricola.cloud;
    location / { return 301 https://$host$request_uri; }   # certbot suele añadir esto
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sl-asistencias.slagricola.cloud;

    # Certificados de certbot (ajusta la ruta si difiere).
    ssl_certificate     /etc/letsencrypt/live/sl-asistencias.slagricola.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sl-asistencias.slagricola.cloud/privkey.pem;

    # La subida de fotos para enrolar rostro pesa más que el default (1 MB).
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:8005;       # Traefik interno del stack nuevo
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                # el 1er request puede tardar (carga de modelos)
    }
}
