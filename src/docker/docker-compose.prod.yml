# docker-compose.prod.yml — Microservicios + Postgres para el VPS.
#
# El API Gateway es TRAEFIK (servicio 'traefik'): único punto de entrada (80/443),
# descubre los servicios por labels y centraliza rate-limit/headers/TLS. Reemplaza
# al Nginx del host (nginx/fe-scanner.conf queda solo como referencia histórica).
# Los microservicios NO publican puertos al host: Traefik los alcanza por la red
# interna de Docker. Postgres tampoco publica puerto: solo la red interna.
#
# Variables (POSTGRES_*, JWT_SECRET, CORS_ORIGINS) se leen del archivo .env que
# esté JUNTO a este compose (pruebas/docker/.env). Ver env.example.
#
# Levantar:   docker compose -f docker-compose.prod.yml up -d --build
# Logs:       docker compose -f docker-compose.prod.yml logs -f backend
#
# NOTA: init.sql solo se ejecuta al inicializar un volumen VACÍO. Si vas a
# restaurar un dump con datos, hazlo aparte (psql).
#
# CAMBIO IMPORTANTE vs versión anterior:
#   · Los ROLES ya están integrados dentro de init.sql (no se carga seed_roles
#     por separado). Una sola fuente de verdad para todo el esquema.
#   · Se agregó tuning de Postgres para +20k trabajadores + índice HNSW + geo.
#     Ajusta los valores a la RAM real de tu VPS (abajo: supuesto ~4 GB).

# Nombre de proyecto propio: aísla esta copia (volúmenes/red) de la v1.
name: sl_asistencias

services:
  # ── API Gateway (Traefik) ──────────────────────────────────────────────────
  # Único punto de entrada (80/443). Descubre los microservicios por labels (no
  # hay que editar un archivo central por cada servicio nuevo) y centraliza
  # rate-limit, headers de seguridad y —opcional— TLS y validación de JWT.
  # Reemplaza al Nginx del host. El dashboard queda SOLO en localhost (8080).
  # Mini-proxy que reescribe la versión de la API de Docker (Engine 29 rechaza la
  # que pide Traefik). Solo Traefik lo consume por la red interna; no expone puertos
  # ni da a Traefik acceso directo al socket (lo tiene SOLO este proxy).
  dockerproxy:
    image: nginx:alpine
    container_name: sl_dockerproxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/dockerproxy.conf:/etc/nginx/nginx.conf:ro

  traefik:
    image: traefik:v3.5
    container_name: sl_traefik
    restart: unless-stopped
    depends_on:
      - dockerproxy
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      # 80/443 los tiene el NGINX del host (varios sitios). Traefik queda INTERNO:
      # el nginx termina TLS y hace reverse-proxy de sl-asistencias.slagricola.cloud
      # a este puerto. Es el MISMO 8005 que ya usaba el monolito v1, así NO se toca
      # el vhost de nginx (solo se apaga v1 antes). Solo 127.0.0.1 (no a internet).
      - "127.0.0.1:8005:80"
      - "127.0.0.1:8080:8080"   # dashboard, SOLO localhost
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt

  postgres:
    build: .
    image: pgvector-postgis:pg17
    container_name: fe_postgres
    restart: unless-stopped
    command:
      - "postgres"
      # ── pg_cron ──────────────────────────────────────────────────────────
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-SL_ASISTENCIAS}"
      - "-c"
      - "cron.timezone=America/Mazatlan"
      - "-c"
      - "TimeZone=America/Mazatlan"
      # ── Tuning +20k trabajadores + HNSW + geo (AJUSTA A LA RAM DEL VPS) ───
      # Supuesto: ~4 GB RAM. Regla rápida: shared_buffers≈25% RAM,
      # effective_cache_size≈75% RAM. Si tu VPS tiene 8 GB, duplica ambos.
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "maintenance_work_mem=512MB" # CRÍTICO: acelera el build del HNSW
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_maintenance_workers=2"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "random_page_cost=1.1" # asume disco SSD
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-SL_ASISTENCIAS}
    ports:
      # Acceso local para clientes de BD (DBeaver/DataGrip). SOLO localhost: no se
      # expone a la red/Internet. En un VPS, conéctate por túnel SSH a este 127.0.0.1.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Una sola fuente de verdad del ESQUEMA + roles RBAC de la app: init.sql (01).
      # 02 = roles de PostgreSQL (usuarios DB) por microservicio + GRANTs.
      # Corren en orden alfabético y SOLO con volumen vacío (primer arranque).
      # ⚠️ PROD: cambia las contraseñas placeholder de roles_microservicio.sql
      #    (o haz ALTER ROLE ... PASSWORD desde tu gestor de secretos tras el boot).
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./roles_microservicio.sql:/docker-entrypoint-initdb.d/02_roles_microservicio.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-SL_ASISTENCIAS}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../app/back
      dockerfile: Dockerfile
    image: fe-scanner-backend:latest
    container_name: fe_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      media:
        condition: service_started
      recognition:
        condition: service_started
    environment:
      # Base de datos: el host es el NOMBRE del servicio, no localhost.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-SL_ASISTENCIAS}
      # App
      APP_TITLE: "FE Scanner API"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      # Front en producción (CORS). Ej: "https://app.tudominio.com"
      CORS_ORIGINS: ${CORS_ORIGINS}
      # JWT
      JWT_EXPIRE_MINUTES: "480"
      ROLES_TOKEN_SIN_EXPIRACION: "kiosko,escaneador" # roles del APK/scanner: token sin expiración (operan offline)
      # Empresa "comodín" del super-admin (ve TODAS las empresas)
      EMPRESA_ADMIN: "99"
      # Token que prueba que el request pasó por Traefik (anti-bypass del gateway).
      # DEBE coincidir con el valor del middleware gateway-token (label de abajo).
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-CAMBIAR_gateway_token}
      # Microservicio recognition: el backend le manda las imágenes (ya no corre
      # InsightFace/OpenCV aquí). El stack de visión y el anti-spoof viven allá.
      RECOGNITION_SERVICE_URL: "http://recognition:8000"
      RECOGNITION_INTERNAL_TOKEN: ${RECOGNITION_INTERNAL_TOKEN}
      # Microservicio media: el backend ya NO monta el disco de fotos; las guarda
      # y recupera por la API interna de 'media' (token compartido).
      MEDIA_SERVICE_URL: "http://media:8000"
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN}
    labels:
      - "traefik.enable=true"
      # Catch-all (access): lo que no capturen los demás servicios cae aquí.
      # PathPrefix(`/`) es la regla más corta → menor prioridad (fallback).
      - "traefik.http.routers.backend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.middlewares=api-strip@file,jwt-auth@file,gateway-token@docker,rate-limit@file,secure-headers@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # Define el middleware gateway-token (compartido por los 4 routers). El secreto
      # viene del .env vía compose (no queda en el repo); Traefik lo inyecta como
      # X-Gateway-Token, sobreescribiendo cualquier valor que mande el cliente.
      - "traefik.http.middlewares.gateway-token.headers.customRequestHeaders.X-Gateway-Token=${GATEWAY_INTERNAL_TOKEN:-CAMBIAR_gateway_token}"

  # ── Microservicio identity (login, JWT, usuarios, roles) ───────────────────
  # Imagen LIGERA (sin visión/IA). Se conecta con el rol de MÍNIMO PRIVILEGIO
  # svc_identity. Emite el JWT self-contained y lo VALIDA por todos en /validate
  # (lo llama el ForwardAuth de Traefik). Es el ÚNICO servicio que tiene el
  # JWT_SECRET; los demás confían en los headers X-* que inyecta el gateway.
  identity:
    build:
      context: ../app/identity
      dockerfile: Dockerfile
    image: sl-identity:latest
    container_name: sl_identity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: svc_identity
      DB_PASSWORD: ${SVC_IDENTITY_PASSWORD:-CAMBIAR_identity}
      DB_NAME: ${POSTGRES_DB:-SL_ASISTENCIAS}
      APP_TITLE: "Identity Service"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}  # ÚNICO servicio que lo necesita (emite y valida el JWT)
      JWT_EXPIRE_MINUTES: "480"
      # roles del APK/scanner (kiosko, escaneador): token sin expiración (operan offline).
      ROLES_TOKEN_SIN_EXPIRACION: "kiosko,escaneador"
      EMPRESA_ADMIN: "99"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity.rule=PathPrefix(`/usuarios`) || PathPrefix(`/roles`) || PathPrefix(`/api/usuarios`) || PathPrefix(`/api/roles`)"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.routers.identity.middlewares=api-strip@file,rate-limit@file,secure-headers@file"
      - "traefik.http.services.identity.loadbalancer.server.port=8000"

  # ── Microservicio media (almacena/sirve las fotos protegidas) ──────────────
  # Imagen MÍNIMA (sin BD). Dueño del volumen media_data. Solo el backend lo llama
  # por su API interna (token compartido); NO se expone al host (sin 'ports').
  media:
    build:
      context: ../app/media
      dockerfile: Dockerfile
    image: sl-media:latest
    container_name: sl_media
    restart: unless-stopped
    environment:
      MEDIA_DIR: /app/data
      MEDIA_URL: /media
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN}
      DEBUG: "false"
    labels:
      - "traefik.enable=false"   # interno: nunca expuesto por el gateway
    volumes:
      - media_data:/app/data

  # ── Microservicio recognition (motor facial compute-heavy) ─────────────────
  # Imagen PESADA (InsightFace + OpenCV + ONNX + modelo). Se conecta como
  # svc_recognition (SOLO LECTURA de embeddings/trabajadores). NO se expone al host
  # (sin 'ports'): solo el backend lo llama por su API interna (token). Para escalar
  # el reconocimiento, sube réplicas de ESTE servicio.
  recognition:
    build:
      context: ../app/recognition
      dockerfile: Dockerfile
    image: sl-recognition:latest
    container_name: sl_recognition
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: svc_recognition
      DB_PASSWORD: ${SVC_RECOGNITION_PASSWORD:-CAMBIAR_recognition}
      DB_NAME: ${POSTGRES_DB:-SL_ASISTENCIAS}
      APP_TITLE: "Recognition Service"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      PRELOAD_FACE_MODEL: "true"
      ANTISPOOFING_ACTIVO: "true"
      ANTISPOOF_REAL_INDEX: "1"
      ANTISPOOF_UMBRAL: "0.6"
      ANTISPOOF_DIV255: "false"
      RECOGNITION_INTERNAL_TOKEN: ${RECOGNITION_INTERNAL_TOKEN}
    labels:
      - "traefik.enable=false"   # interno: nunca expuesto por el gateway

  # ── Microservicio tenancy (empresas, áreas, puertas, dispositivos) ─────────
  # CRUD de la estructura física. Conecta como svc_tenancy. Es público vía Nginx
  # (/empresas /areas /puertas /dispositivos → 8002).
  tenancy:
    build:
      context: ../app/tenancy
      dockerfile: Dockerfile
    image: sl-tenancy:latest
    container_name: sl_tenancy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: svc_tenancy
      DB_PASSWORD: ${SVC_TENANCY_PASSWORD:-CAMBIAR_tenancy}
      DB_NAME: ${POSTGRES_DB:-SL_ASISTENCIAS}
      APP_TITLE: "Tenancy Service"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      EMPRESA_ADMIN: "99"
      # Token anti-bypass del gateway (debe coincidir con el middleware gateway-token).
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-CAMBIAR_gateway_token}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tenancy.rule=PathPrefix(`/empresas`) || PathPrefix(`/areas`) || PathPrefix(`/puertas`) || PathPrefix(`/dispositivos`) || PathPrefix(`/api/empresas`) || PathPrefix(`/api/areas`) || PathPrefix(`/api/puertas`) || PathPrefix(`/api/dispositivos`)"
      - "traefik.http.routers.tenancy.entrypoints=web"
      - "traefik.http.routers.tenancy.middlewares=api-strip@file,jwt-auth@file,gateway-token@docker,rate-limit@file,secure-headers@file"
      - "traefik.http.services.tenancy.loadbalancer.server.port=8000"

  # ── Microservicio workers (trabajadores + embeddings/biometría) ────────────
  # CRUD de RRHH. Conecta como svc_workers. Llama a recognition para enrolar
  # (extraer el embedding de una foto). Público vía Nginx (/trabajadores /embeddings → 8003).
  workers:
    build:
      context: ../app/workers
      dockerfile: Dockerfile
    image: sl-workers:latest
    container_name: sl_workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      recognition:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: svc_workers
      DB_PASSWORD: ${SVC_WORKERS_PASSWORD:-CAMBIAR_workers}
      DB_NAME: ${POSTGRES_DB:-SL_ASISTENCIAS}
      APP_TITLE: "Workers Service"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      EMPRESA_ADMIN: "99"
      # Token anti-bypass del gateway (debe coincidir con el middleware gateway-token).
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-CAMBIAR_gateway_token}
      RECOGNITION_SERVICE_URL: "http://recognition:8000"
      RECOGNITION_INTERNAL_TOKEN: ${RECOGNITION_INTERNAL_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.workers.rule=PathPrefix(`/trabajadores`) || PathPrefix(`/embeddings`) || PathPrefix(`/api/trabajadores`) || PathPrefix(`/api/embeddings`)"
      - "traefik.http.routers.workers.entrypoints=web"
      - "traefik.http.routers.workers.middlewares=api-strip@file,jwt-auth@file,gateway-token@docker,rate-limit@file,secure-headers@file"
      - "traefik.http.services.workers.loadbalancer.server.port=8000"

  # ── Microservicio employee_monitoring (sync nómina SYS21 → trabajadores) ────
  # Lee la nómina externa SYS21 (MSSQL) y las fotos por SFTP, y mantiene
  # sincronizados trabajadores/embeddings. Conecta como svc_workers (mismo dueño
  # de esas tablas). INTERNO: por defecto NO se expone al gateway (sync + endpoints
  # de admin). Para exponer /sync, ver las labels traefik comentadas abajo.
  employee_monitoring:
    build:
      context: ../app/employee_monitoring
      dockerfile: Dockerfile
    image: sl-employee-monitoring:latest
    container_name: sl_employee_monitoring
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      recognition:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: svc_workers
      DB_PASSWORD: ${SVC_WORKERS_PASSWORD:-CAMBIAR_workers}
      DB_NAME: ${POSTGRES_DB:-SL_ASISTENCIAS}
      APP_TITLE: "Employee Monitoring Service"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      EMPRESA_ADMIN: "99"
      # Anti-bypass del gateway: debe coincidir con el middleware gateway-token.
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-CAMBIAR_gateway_token}
      RECOGNITION_SERVICE_URL: "http://recognition:8000"
      RECOGNITION_INTERNAL_TOKEN: ${RECOGNITION_INTERNAL_TOKEN}
      # Nómina SYS21 (origen de empleados)
      SYS_21_URL_AGRICOLA: ${SYS_21_URL_AGRICOLA}
      SYS_21_URL_AGRICOLA_COM: ${SYS_21_URL_AGRICOLA_COM}
      # Servidor de fotos (SFTP con llave)
      FOTOS_SFTP_HOST: ${FOTOS_SFTP_HOST}
      FOTOS_SFTP_PORT: ${FOTOS_SFTP_PORT:-22}
      FOTOS_SFTP_USER: ${FOTOS_SFTP_USER}
      FOTOS_SFTP_KEY_PATH: /run/secrets/fotos/fotos_ssh_key
      FOTOS_SFTP_BASE_DIR: ${FOTOS_SFTP_BASE_DIR}
      # Sincronización / scheduler (CRON en hora local, escalonado por origen)
      SYNC_ENABLED: "true"
      SYNC_RUN_ON_STARTUP: "false"
      SYNC_TZ: ${SYNC_TZ:-America/Mazatlan}
      SYNC_CRON_COM: ${SYNC_CRON_COM:-2,14}            # comercial 02:00 y 14:00
      SYNC_CRON_AGRICOLA: ${SYNC_CRON_AGRICOLA:-3,15}  # agrícola 03:00 y 15:00
      SYNC_COM_TEST_INTERVAL_MIN: ${SYNC_COM_TEST_INTERVAL_MIN:-0}  # 0 = cron normal (prod); >0 = comercial cada N min (prueba)
    # Sin 'ports': es INTERNO (sync por scheduler + admin). El scheduler corre solo
    # (cron interno, sin HTTP). Para exponer /emp_sync por el gateway, descomenta las
    # labels traefik de abajo. Para depurar local, descomenta el port temporalmente.
    # ports:
    #   - "8010:8000"
    volumes:
      # Carpeta de secretos (read-only). En Docker Desktop/Windows montar la CARPETA
      # es más confiable que un bind-mount de un solo archivo. La llave queda en
      # /run/secrets/fotos/fotos_ssh_key (ver FOTOS_SFTP_KEY_PATH).
      - ${FOTOS_SSH_KEY_DIR:-./secrets}:/run/secrets/fotos:ro
    labels:
      - "traefik.enable=false"   # interno: sync + admin. No expuesto por el gateway.
      # Para exponer SOLO los endpoints de consulta/admin bajo /emp_sync, descomenta:
      # - "traefik.enable=true"
      # - "traefik.http.routers.empmon.rule=PathPrefix(`/emp_sync`)"
      # - "traefik.http.routers.empmon.entrypoints=web"
      # - "traefik.http.routers.empmon.middlewares=jwt-auth@file,gateway-token@docker,rate-limit@file,secure-headers@file"
      # - "traefik.http.services.empmon.loadbalancer.server.port=8000"

  # ── Microservicio offline_sync (roster + ingesta del APK kiosko offline) ────
  # Entrega el roster (trabajadores+embeddings+áreas+puertas) al APK para reconocer
  # SIN conexión, y recibe por lotes lo que capturó offline: asistencias e intentos
  # (CSV, idempotente ON CONFLICT) y enrolamientos walk-in (JSON con el embedding ya
  # calculado en el teléfono). Conecta como svc_offline (mínimo privilegio). Imagen
  # LIGERA: sin visión/IA ni ODBC.
  offline_sync:
    build:
      context: ../app/offline_sync
      dockerfile: Dockerfile
    image: sl-offline-sync:latest
    container_name: sl_offline_sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: svc_offline
      DB_PASSWORD: ${SVC_OFFLINE_PASSWORD:-CAMBIAR_offline}
      DB_NAME: ${POSTGRES_DB:-SL_ASISTENCIAS}
      APP_TITLE: "Offline Sync Service"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      EMPRESA_ADMIN: "99"
      # Anti-bypass del gateway: debe coincidir con el middleware gateway-token.
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-CAMBIAR_gateway_token}
      # Roster
      ROSTER_TIPOS: ${ROSTER_TIPOS:-campo,oficina,empaque}
      ROSTER_INCLUIR_GENERAL: ${ROSTER_INCLUIR_GENERAL:-false}  # false = Opción A (estricto); true = + 'general'
      # Ingesta / enrolamiento
      INGESTA_MAX_FILAS: ${INGESTA_MAX_FILAS:-50000}
      ENROL_ORIGEN: "apk"
      EMBEDDING_DIM: "512"
      ENROL_MODELO_IA: "buffalo_l"
    # Sin 'ports': el APK lo alcanza por el gateway (HTTPS). Para depurar local,
    # descomenta temporalmente y revisa /docs en http://localhost:8011.
    # ports:
    #   - "8011:8000"
    labels:
      # Expuesto al APK por el gateway. offline_sync usa /off_sync (employee_monitoring
      # usa /emp_sync): sin colisión. El JWT lo valida Traefik (jwt-auth → identity),
      # luego este servicio autoriza por scope (scanner:use ⇒ off_sync:read/write).
      - "traefik.enable=true"
      - "traefik.http.routers.offsync.rule=PathPrefix(`/off_sync`) || PathPrefix(`/api/off_sync`)"
      - "traefik.http.routers.offsync.entrypoints=web"
      - "traefik.http.routers.offsync.middlewares=api-strip@file,jwt-auth@file,gateway-token@docker,rate-limit@file,secure-headers@file"
      - "traefik.http.services.offsync.loadbalancer.server.port=8000"

  # ── Microservicio reports (reportes, SOLO LECTURA + export XLSX/CSV) ────────
  # Conecta como svc_reports (SELECT a todo; idealmente una réplica de lectura).
  # Público vía Nginx (/reportes → 8004).
  reports:
    build:
      context: ../app/reports
      dockerfile: Dockerfile
    image: sl-reports:latest
    container_name: sl_reports
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: svc_reports
      DB_PASSWORD: ${SVC_REPORTS_PASSWORD:-CAMBIAR_reports}
      DB_NAME: ${POSTGRES_DB:-SL_ASISTENCIAS}
      APP_TITLE: "Reports Service"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      EMPRESA_ADMIN: "99"
      # Token anti-bypass del gateway (debe coincidir con el middleware gateway-token).
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-CAMBIAR_gateway_token}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reports.rule=PathPrefix(`/reportes`) || PathPrefix(`/api/reportes`)"
      - "traefik.http.routers.reports.entrypoints=web"
      - "traefik.http.routers.reports.middlewares=api-strip@file,jwt-auth@file,gateway-token@docker,rate-limit@file,secure-headers@file"
      - "traefik.http.services.reports.loadbalancer.server.port=8000"

volumes:
  postgres_data:
  media_data:
  traefik_letsencrypt:
