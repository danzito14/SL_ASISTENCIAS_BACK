# docker-compose.prod.yml — Backend + Postgres para el VPS.
#
# Nginx va en el HOST (ver nginx/fe-scanner.conf) y hace de reverse proxy + HTTPS.
# El backend solo escucha en 127.0.0.1:8000, así que únicamente Nginx lo alcanza
# (no queda expuesto a internet). Postgres no publica puerto: solo la red interna.
#
# Variables (POSTGRES_*, JWT_SECRET, CORS_ORIGINS) se leen del archivo .env que
# esté JUNTO a este compose (pruebas/docker/.env). Ver env.example.
#
# Levantar:   docker compose -f docker-compose.prod.yml up -d --build
# Logs:       docker compose -f docker-compose.prod.yml logs -f backend
#
# NOTA: init.sql solo se ejecuta al inicializar un volumen VACÍO. Si vas a
# restaurar un dump con datos, hazlo aparte (psql).
#
# CAMBIO IMPORTANTE vs versión anterior:
#   · Los ROLES ya están integrados dentro de init.sql (no se carga seed_roles
#     por separado). Una sola fuente de verdad para todo el esquema.
#   · Se agregó tuning de Postgres para +20k trabajadores + índice HNSW + geo.
#     Ajusta los valores a la RAM real de tu VPS (abajo: supuesto ~4 GB).

# Nombre de proyecto propio: aísla esta copia (volúmenes/red) de la v1.
name: sl_asistencias

services:
  postgres:
    build: .
    image: pgvector-postgis:pg17
    container_name: fe_postgres
    restart: unless-stopped
    command:
      - "postgres"
      # ── pg_cron ──────────────────────────────────────────────────────────
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-SL_ASISTENCIAS}"
      - "-c"
      - "cron.timezone=America/Mazatlan"
      - "-c"
      - "TimeZone=America/Mazatlan"
      # ── Tuning +20k trabajadores + HNSW + geo (AJUSTA A LA RAM DEL VPS) ───
      # Supuesto: ~4 GB RAM. Regla rápida: shared_buffers≈25% RAM,
      # effective_cache_size≈75% RAM. Si tu VPS tiene 8 GB, duplica ambos.
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "maintenance_work_mem=512MB" # CRÍTICO: acelera el build del HNSW
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_maintenance_workers=2"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "random_page_cost=1.1" # asume disco SSD
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-SL_ASISTENCIAS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Una sola fuente de verdad del ESQUEMA + roles RBAC de la app: init.sql (01).
      # 02 = roles de PostgreSQL (usuarios DB) por microservicio + GRANTs.
      # Corren en orden alfabético y SOLO con volumen vacío (primer arranque).
      # ⚠️ PROD: cambia las contraseñas placeholder de roles_microservicio.sql
      #    (o haz ALTER ROLE ... PASSWORD desde tu gestor de secretos tras el boot).
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./roles_microservicio.sql:/docker-entrypoint-initdb.d/02_roles_microservicio.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-SL_ASISTENCIAS}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../app/back
      dockerfile: Dockerfile
    image: fe-scanner-backend:latest
    container_name: fe_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Base de datos: el host es el NOMBRE del servicio, no localhost.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-SL_ASISTENCIAS}
      # App
      APP_TITLE: "FE Scanner API"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      # Front en producción (CORS). Ej: "https://app.tudominio.com"
      CORS_ORIGINS: ${CORS_ORIGINS}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: "480"
      ROLES_TOKEN_SIN_EXPIRACION: "kiosko" # rol del scanner (antes 'scanner')
      # Empresa "comodín" del super-admin (ve TODAS las empresas)
      EMPRESA_ADMIN: "99"
      # Reconocimiento facial / anti-spoof
      PRELOAD_FACE_MODEL: "true"
      ANTISPOOFING_ACTIVO: "true"
      ANTISPOOF_REAL_INDEX: "1"
      ANTISPOOF_UMBRAL: "0.6"
      ANTISPOOF_DIV255: "false"
    volumes:
      # Fotos de incidencias/intentos: volumen para que PERSISTAN entre redeploys.
      - media_data:/app/media
    ports:
      - "127.0.0.1:8000:8000" # solo accesible desde el host → Nginx

volumes:
  postgres_data:
  media_data:
