# Mini-stack LOCAL del kiosko de escritorio (corre en la PC del kiosko, NO en la nube).
# Fase 1: postgres local (roster) + kiosk_local (baja el roster de la nube).
# Fase 2: se suma 'recognition' (mismo código de prod) para reconocer offline.
# Arranque:  docker compose -f docker-compose.local.yml up -d --build
#
# OJO con el nombre: este stack es de DESARROLLO y se llama 'kiosk_dev' (contenedores
# kiosk_dev_*) a propósito. Antes se llamaba 'kiosk', igual que el del instalador, y en
# una PC con ambos se pisaban los contenedores Y el volumen de datos: el de dev inicializa
# la BD con la contraseña por default y el instalado con un secreto aleatorio, así que el
# segundo en arrancar moría con "password authentication failed for user root".
# NO pases -p kiosk: eso reintroduce exactamente ese choque.
name: kiosk_dev

services:
  # Postgres+pgvector LOCAL — mismo esquema que prod (init.sql). Guarda el roster de
  # UNA empresa + la cola de escaneos. Solo escucha en localhost.
  kiosk_postgres:
    image: pgvector-postgis:pg17            # imagen ya construida por el stack principal
    container_name: kiosk_dev_postgres
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"   # init.sql crea la extensión pg_cron
      - "-c"
      - "cron.database_name=SL_ASISTENCIAS"
      - "-c"
      - "cron.timezone=America/Mazatlan"
      - "-c"
      - "TimeZone=America/Mazatlan"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${KIOSK_DB_PASSWORD:-CAMBIAR_kiosk}
      POSTGRES_DB: SL_ASISTENCIAS
    volumes:
      - kiosk_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./roles_microservicio.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
    ports:
      - "127.0.0.1:5533:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d SL_ASISTENCIAS"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Con el volumen vacío, initdb + init.sql + roles pueden pasar de los 50 s que dan
      # interval*retries en un equipo lento; sin esto el contenedor se marca unhealthy y
      # el resto muere con "dependency failed to start". Durante start_period los
      # chequeos fallidos no cuentan.
      start_period: 180s

  # Backend local: baja el roster de la nube → BD local. Escucha en localhost:8100.
  kiosk_local:
    build: ../app/kiosk_local
    image: sl-kiosk-local:latest
    container_name: kiosk_dev_local
    environment:
      DB_HOST: kiosk_postgres
      DB_PORT: "5432"
      DB_USER: root
      DB_PASSWORD: ${KIOSK_DB_PASSWORD:-CAMBIAR_kiosk}
      DB_NAME: SL_ASISTENCIAS
      DEBUG: ${KIOSK_DEBUG:-false}
      # Nube: por defecto el gateway del stack dev de ESTA máquina (host.docker.internal).
      # En prod real = https://sl-asistencias.slagricola.cloud/api
      CLOUD_BASE_URL: ${KIOSK_CLOUD_URL:-http://host.docker.internal:8005}
      KIOSK_USER: ${KIOSK_USER:-kiosko_test}
      KIOSK_PASSWORD: ${KIOSK_PASSWORD:-Kiosko-SL-2026}
      KIOSK_TIPO: ${KIOSK_TIPO:-oficina}
      KIOSK_EMPRESA: ${KIOSK_EMPRESA:-1}
      KIOSK_TZ: ${KIOSK_TZ:-America/Mazatlan}
      # Reconocimiento LOCAL (contenedor recognition de abajo, apuntando a la BD local).
      RECOGNITION_URL: http://recognition:8000
      RECOGNITION_INTERNAL_TOKEN: ${RECOGNITION_INTERNAL_TOKEN:-kiosk-local-token}
      # Escáner unificado: /scanner/* se reenvía al back local (mismas rutas que la nube).
      BACKEND_LOCAL_URL: http://backend:8000
      BACKEND_GATEWAY_TOKEN: ${KIOSK_GATEWAY_TOKEN:-CAMBIAR_gateway_kiosk}
      KIOSK_SCANNER_FALLBACK_NUBE: ${KIOSK_SCANNER_FALLBACK:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      kiosk_postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # El MISMO back de la nube, en MODO_KIOSKO y contra la BD local. Es quien resuelve
  # /scanner/* (kiosk_local solo hace de gateway y lo reenvía), así que el escáner offline
  # ejecuta EXACTAMENTE el mismo código que el online. Sin puerto publicado: interno.
  backend:
    build: ../app/back
    image: fe-scanner-backend:latest
    container_name: kiosk_dev_backend
    environment:
      DB_HOST: kiosk_postgres
      DB_PORT: "5432"
      DB_USER: root
      DB_PASSWORD: ${KIOSK_DB_PASSWORD:-CAMBIAR_kiosk}
      DB_NAME: SL_ASISTENCIAS
      APP_TITLE: "SL Asistencias (kiosko dev)"
      APP_VERSION: "1.0.0"      # obligatoria en back/core/config.py (sin default)
      DEBUG: ${KIOSK_DEBUG:-false}
      EMPRESA_ADMIN: "99"
      # Encola el escaneo (sincronizado_en NULL) y no consolida ni guarda fotos por media:
      # eso lo hace la nube al recibir la cola. Ver back/src/services/scanner_service.py.
      MODO_KIOSKO: "true"
      GATEWAY_INTERNAL_TOKEN: ${KIOSK_GATEWAY_TOKEN:-CAMBIAR_gateway_kiosk}
      RECOGNITION_SERVICE_URL: http://recognition:8000
      RECOGNITION_INTERNAL_TOKEN: ${RECOGNITION_INTERNAL_TOKEN:-kiosk-local-token}
    depends_on:
      kiosk_postgres:
        condition: service_healthy

  # FASE 2: reconocimiento LOCAL — MISMA imagen/código de prod, apuntando a la BD local.
  # Garantiza paridad total (es el mismo motor buffalo_l + pgvector). Reusa sl-recognition:latest
  # (ya construida por el stack principal). Conecta como root (superuser local) = SELECT libre.
  recognition:
    image: sl-recognition:latest
    container_name: kiosk_dev_recognition
    environment:
      DB_HOST: kiosk_postgres
      DB_PORT: "5432"
      DB_USER: root
      DB_PASSWORD: ${KIOSK_DB_PASSWORD:-CAMBIAR_kiosk}
      DB_NAME: SL_ASISTENCIAS
      RECOGNITION_INTERNAL_TOKEN: ${RECOGNITION_INTERNAL_TOKEN:-kiosk-local-token}
      PRELOAD_FACE_MODEL: "true"
      # Liveness / anti-spoof (webcam = riesgo de foto/pantalla). Modelo MiniFASNet ya
      # horneado. OJO: está afinado a la distancia del terminal; en un selfie de webcam
      # muy de cerca da FALSO spoof (recorte de contexto 2.7× se sale). DEFAULT OFF hasta
      # validarlo/afinarlo con capturas reales a distancia de kiosko (KIOSK_ANTISPOOF=true).
      ANTISPOOFING_ACTIVO: ${KIOSK_ANTISPOOF:-false}
      # Params del modelo anti-spoof: MISMOS que prod (validados). CRÍTICO: div255=false y
      # real_index=1 definen el preprocesamiento correcto; con otros valores el modelo da
      # resultados basura (probable causa del "falla en webcam" reportado antes). Activar con
      # KIOSK_ANTISPOOF=true y CALIBRAR el umbral con capturas reales del kiosko (ver logs
      # de recognition: 'Anti-spoof: probs=... score_real=... es_real=').
      ANTISPOOF_UMBRAL: ${KIOSK_ANTISPOOF_UMBRAL:-0.6}
      ANTISPOOF_REAL_INDEX: ${KIOSK_ANTISPOOF_REAL_INDEX:-1}
      ANTISPOOF_DIV255: ${KIOSK_ANTISPOOF_DIV255:-false}
      # ── Gate de CALIDAD del frame (solo el kiosko; prod/cámaras no lo usan) ──────
      # Descarta frames malos (borrosos, cara cortada, muy lejos, detección débil) antes
      # del match → estado "baja_calidad", que kiosk_local trata como "sigue intentando".
      # OJO: los umbrales de abajo son de ARRANQUE; CALIBRAR con capturas reales de la
      # webcam del kiosko (mirar los logs de recognition: det_score/face_ratio/blur de los
      # frames que rechaza vs los buenos). Muy agresivo = rechaza gente real. Poner 0 en
      # cualquiera lo desactiva; CALIDAD_GATE_ACTIVO=false apaga el gate completo.
      CALIDAD_GATE_ACTIVO: ${KIOSK_CALIDAD_GATE:-true}
      CALIDAD_DET_SCORE_MIN: ${KIOSK_CALIDAD_DET_SCORE_MIN:-0.6}   # confianza de detección (0..1)
      CALIDAD_FACE_RATIO_MIN: ${KIOSK_CALIDAD_FACE_RATIO_MIN:-0.03} # área cara / área imagen
      CALIDAD_BLUR_MIN: ${KIOSK_CALIDAD_BLUR_MIN:-40}              # varianza Laplaciano (nitidez)
      CALIDAD_BORDE_MARGEN: ${KIOSK_CALIDAD_BORDE_MARGEN:-0.01}    # fracción del borde → cara parcial
      # ── Umbrales de MATCH y LIVENESS (afinables por sitio) ── default = valor del motor.
      # Súbelos/bájalos según la cámara/iluminación de ESTE kiosko. Cambio = editar y
      # 'docker compose ... up -d recognition' (~30s). Ver comentarios en config.py/motor.py.
      SIMILITUD_UMBRAL: ${KIOSK_SIMILITUD_UMBRAL:-0.5}                  # match: mayor = más estricto
      SIMILITUD_UMBRAL_ACOTADO: ${KIOSK_SIMILITUD_UMBRAL_ACOTADO:-0.40} # match acotado por nombre
      SPOOFING_UMBRAL: ${KIOSK_SPOOFING_UMBRAL:-0.5}                    # score de realidad mínimo
      LIVENESS_MOVIMIENTO_MIN: ${KIOSK_LIVENESS_MOV_MIN:-0.004}         # menos movimiento = foto → no_vivo (súbelo si pasan fotos)
      LIVENESS_MISMA_PERSONA_UMBRAL: ${KIOSK_LIVENESS_SIM_MIN:-0.45}    # similitud entre frames (misma persona)
      LIVENESS_MIN_FRAMES_CON_ROSTRO: ${KIOSK_LIVENESS_MIN_FRAMES:-2}   # frames con rostro mínimos
      # Config EN CALIENTE: recognition local lee overrides de parametros_sistema (los
      # escribe el front vía POST /kiosk/config). Los env de arriba quedan como DEFAULT.
      CONFIG_RUNTIME_ACTIVO: ${KIOSK_CONFIG_RUNTIME:-true}
      CONFIG_RUNTIME_TTL: ${KIOSK_CONFIG_RUNTIME_TTL:-15}
    depends_on:
      kiosk_postgres:
        condition: service_healthy

volumes:
  kiosk_pgdata:
