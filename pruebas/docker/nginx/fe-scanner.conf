# Nginx (en el HOST del VPS) — reverse proxy para FE Scanner API.
#
# Instalación:
#   sudo cp fe-scanner.conf /etc/nginx/sites-available/fe-scanner
#   sudo ln -s /etc/nginx/sites-available/fe-scanner /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (recomendado): tras dejar funcionando este bloque en HTTP, corre
#   sudo certbot --nginx -d api.tudominio.com
# Certbot reescribe este archivo solo para añadir el listen 443 + certificados.

server {
    listen 80;
    server_name api.tudominio.com;          # ← CAMBIA por tu dominio (o la IP del VPS)

    # La subida de fotos para enrolar rostro pesa más que el default (1 MB).
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:8000;   # backend dockerizado (solo escucha local)

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;          # el primer request puede cargar el modelo facial
    }
}
